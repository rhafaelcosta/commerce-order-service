spring:
    application:
        name: order-service
    datasource:
        url: jdbc:postgresql://localhost:5432/ordering_test
        username: postgres
        password: postgres
        hikari:
            minimum-idle: 1
            maximum-pool-size: 10
            conection-timeout: 3000
    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
    flyway:
        enabled: true
        locations: classpath:db/migration,classpath:db/clean
        user: postgres
        password: postgres
        url: jdbc:postgresql://localhost:5432/ordering_test

commerce-platform:
    integrations:
        shipping.provider: FAKE
        rapidex.url: http://localhost:8780
        product-catalog.url: http://localhost:8781